<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | HerbIT</title>
  <meta name="description" content="Sign in to your HerbIT account to access medicinal plant collections, personal garden tracker, and Santhamithra AI guidance." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Auth Page Botanical Layout */
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 10% 20%, rgba(82, 183, 136, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(45, 106, 79, 0.08) 0%, transparent 40%),
                  var(--bg-color);
    }

    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2.25rem;
      position: relative;
      overflow: hidden;
      transition: var(--transition-normal);
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-light);
      color: var(--primary);
      padding: 0.35rem 0.9rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .auth-title {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .auth-alert {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      align-items: flex-start;
      gap: 0.65rem;
      line-height: 1.4;
    }

    .auth-alert.error {
      display: flex;
      background: var(--danger-light);
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .auth-alert.success {
      display: flex;
      background: var(--accent-light);
      color: var(--primary);
      border: 1px solid #a7f3d0;
    }

    .auth-form-group {
      margin-bottom: 1.35rem;
    }

    .auth-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .auth-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-light);
      font-size: 0.95rem;
      pointer-events: none;
      transition: var(--transition-fast);
    }

    .auth-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--surface);
      transition: var(--transition-fast);
      outline: none;
    }

    .auth-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .auth-input:focus + .auth-input-icon {
      color: var(--accent);
    }

    .auth-password-toggle {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 0.35rem;
      font-size: 0.95rem;
      transition: var(--transition-fast);
    }

    .auth-password-toggle:hover {
      color: var(--primary);
    }

    .auth-btn-submit {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #ffffff;
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-md);
      transition: var(--transition-normal);
      margin-top: 1.5rem;
    }

    .auth-btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--primary-hover), var(--primary));
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .auth-btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary-light);
      font-weight: 600;
      text-decoration: underline;
    }

    .auth-footer a:hover {
      color: var(--primary);
    }

    .auth-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 1.25rem;
      text-decoration: none !important;
      transition: var(--transition-fast);
    }

    .auth-back-link:hover {
      color: var(--primary);
      transform: translateX(-3px);
    }
  </style>
</head>
<body class="auth-page">

  <!-- Simple Botanical Brand Header -->
  <header class="navbar-header" style="box-shadow: none; border-bottom: 1px solid var(--border);">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon"><i class="fa-solid fa-leaf"></i></span>
        <span class="logo-text"><span class="brand-herb">Herb</span><span class="brand-it">IT</span></span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">
        <i class="fa-solid fa-house"></i> Return Home
      </a>
    </div>
  </header>

  <!-- Login Main Section -->
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">
          <i class="fa-solid fa-seedling"></i> Welcome Back
        </div>
        <h1 class="auth-title">Sign In to HerbIT</h1>
        <p class="auth-subtitle">Grow Knowledge. Nurture Nature.</p>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="auth-alert" role="alert">
        <i id="alert-icon" class="fa-solid fa-circle-exclamation"></i>
        <span id="alert-text"></span>
      </div>

      <form id="login-form" novalidate>
        <!-- Email -->
        <div class="auth-form-group">
          <label for="email" class="auth-label">Email Address</label>
          <div class="auth-input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              class="auth-input"
              placeholder="botanist@herbalgarden.edu"
              required
              autocomplete="email"
            />
            <i class="fa-solid fa-envelope auth-input-icon"></i>
          </div>
        </div>

        <!-- Password -->
        <div class="auth-form-group">
          <label for="password" class="auth-label">Password</label>
          <div class="auth-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="auth-input"
              placeholder="••••••••••••"
              required
              autocomplete="current-password"
            />
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <button type="button" class="auth-password-toggle" id="toggle-password" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-btn-submit" id="submit-btn">
          <span id="submit-text"><i class="fa-solid fa-right-to-bracket"></i> Sign In</span>
          <i class="fa-solid fa-circle-notch fa-spin" id="submit-spinner" style="display: none;"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account yet? <a href="register.html">Register here</a></p>
        <div>
          <a href="index.html" class="auth-back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Medicinal Explorer
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Elements
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const togglePasswordIcon = document.getElementById('toggle-password-icon');
    const alertBox = document.getElementById('auth-alert');
    const alertText = document.getElementById('alert-text');
    const alertIcon = document.getElementById('alert-icon');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');
    const submitSpinner = document.getElementById('submit-spinner');

    // Parse URL params (for redirect or registered notice)
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '';
    if (urlParams.get('registered') === 'true') {
      showAlert('Account created successfully! Please sign in with your credentials.', 'success');
    }

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePasswordIcon.className = type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    });

    function showAlert(message, type = 'error') {
      alertText.textContent = message;
      alertBox.className = `auth-alert ${type}`;
      alertIcon.className = type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check';
      alertBox.style.display = 'flex';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert('Please enter both your email and password.');
        return;
      }

      // Disable button
      submitBtn.disabled = true;
      submitText.style.display = 'none';
      submitSpinner.style.display = 'inline-block';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            if (redirectUrl) {
              window.location.href = decodeURIComponent(redirectUrl);
            } else if (data.user && data.user.role === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/index.html';
            }
          }, 800);
        } else {
          showAlert(data.message || 'Invalid email or password.');
          submitBtn.disabled = false;
          submitText.style.display = 'inline-flex';
          submitSpinner.style.display = 'none';
        }
      } catch (err) {
        console.error('Login network error:', err);
        showAlert('Unable to connect to the herbal server. Please check your network.');
        submitBtn.disabled = false;
        submitText.style.display = 'inline-flex';
        submitSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
