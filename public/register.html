<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | HerbIT</title>
  <meta name="description" content="Create a HerbIT account to explore medicinal plants, manage your personal garden, and consult Santhamithra AI." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Auth Page Botanical Layout */
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 10% 20%, rgba(82, 183, 136, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(45, 106, 79, 0.08) 0%, transparent 40%),
                  var(--bg-color);
    }

    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2.25rem;
      position: relative;
      overflow: hidden;
      transition: var(--transition-normal);
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-light);
      color: var(--primary);
      padding: 0.35rem 0.9rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .auth-title {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.4rem;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .auth-alert {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-bottom: 1.35rem;
      align-items: flex-start;
      gap: 0.65rem;
      line-height: 1.4;
    }

    .auth-alert.error {
      display: flex;
      background: var(--danger-light);
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .auth-alert.success {
      display: flex;
      background: var(--accent-light);
      color: var(--primary);
      border: 1px solid #a7f3d0;
    }

    .auth-form-group {
      margin-bottom: 1.15rem;
    }

    .auth-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .auth-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-light);
      font-size: 0.95rem;
      pointer-events: none;
      transition: var(--transition-fast);
    }

    .auth-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--surface);
      transition: var(--transition-fast);
      outline: none;
    }

    .auth-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .auth-input:focus + .auth-input-icon {
      color: var(--accent);
    }

    .auth-password-toggle {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 0.35rem;
      font-size: 0.95rem;
      transition: var(--transition-fast);
    }

    .auth-password-toggle:hover {
      color: var(--primary);
    }

    .auth-help-text {
      font-size: 0.75rem;
      color: var(--text-light);
      margin-top: 0.25rem;
    }

    .auth-btn-submit {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #ffffff;
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-md);
      transition: var(--transition-normal);
      margin-top: 1.5rem;
    }

    .auth-btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--primary-hover), var(--primary));
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .auth-btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary-light);
      font-weight: 600;
      text-decoration: underline;
    }

    .auth-footer a:hover {
      color: var(--primary);
    }

    .auth-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 1rem;
      text-decoration: none !important;
      transition: var(--transition-fast);
    }

    .auth-back-link:hover {
      color: var(--primary);
      transform: translateX(-3px);
    }
  </style>
</head>
<body class="auth-page">

  <!-- Botanical Brand Header -->
  <header class="navbar-header" style="box-shadow: none; border-bottom: 1px solid var(--border);">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon"><i class="fa-solid fa-leaf"></i></span>
        <span class="logo-text"><span class="brand-herb">Herb</span><span class="brand-it">IT</span></span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">
        <i class="fa-solid fa-house"></i> Return Home
      </a>
    </div>
  </header>

  <!-- Register Main Section -->
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">
          <i class="fa-solid fa-leaf"></i> Join the Community
        </div>
        <h1 class="auth-title">Join HerbIT</h1>
        <p class="auth-subtitle">Grow Knowledge. Nurture Nature.</p>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="auth-alert" role="alert">
        <i id="alert-icon" class="fa-solid fa-circle-exclamation"></i>
        <span id="alert-text"></span>
      </div>

      <form id="register-form" novalidate>
        <!-- Full Name -->
        <div class="auth-form-group">
          <label for="name" class="auth-label">Full Name</label>
          <div class="auth-input-wrapper">
            <input
              type="text"
              id="name"
              name="name"
              class="auth-input"
              placeholder="e.g. Dr. Sushruta Sharma"
              required
              minlength="2"
              maxlength="50"
              autocomplete="name"
            />
            <i class="fa-solid fa-user auth-input-icon"></i>
          </div>
        </div>

        <!-- Email Address -->
        <div class="auth-form-group">
          <label for="email" class="auth-label">Email Address</label>
          <div class="auth-input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              class="auth-input"
              placeholder="botanist@herbalgarden.edu"
              required
              autocomplete="email"
            />
            <i class="fa-solid fa-envelope auth-input-icon"></i>
          </div>
        </div>

        <!-- Password -->
        <div class="auth-form-group">
          <label for="password" class="auth-label">Password</label>
          <div class="auth-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="auth-input"
              placeholder="Minimum 6 characters"
              required
              minlength="6"
              autocomplete="new-password"
            />
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <button type="button" class="auth-password-toggle" id="toggle-password" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
          <div class="auth-help-text">Must be at least 6 characters long</div>
        </div>

        <!-- Confirm Password -->
        <div class="auth-form-group">
          <label for="confirmPassword" class="auth-label">Confirm Password</label>
          <div class="auth-input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="auth-input"
              placeholder="Re-enter password"
              required
              autocomplete="new-password"
            />
            <i class="fa-solid fa-shield-halved auth-input-icon"></i>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-btn-submit" id="submit-btn">
          <span id="submit-text"><i class="fa-solid fa-user-plus"></i> Complete Registration</span>
          <i class="fa-solid fa-circle-notch fa-spin" id="submit-spinner" style="display: none;"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign in here</a></p>
        <div>
          <a href="index.html" class="auth-back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Medicinal Explorer
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const registerForm = document.getElementById('register-form');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const togglePasswordIcon = document.getElementById('toggle-password-icon');
    const alertBox = document.getElementById('auth-alert');
    const alertText = document.getElementById('alert-text');
    const alertIcon = document.getElementById('alert-icon');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');
    const submitSpinner = document.getElementById('submit-spinner');

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePasswordIcon.className = type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    });

    function showAlert(message, type = 'error') {
      alertText.textContent = message;
      alertBox.className = `auth-alert ${type}`;
      alertIcon.className = type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check';
      alertBox.style.display = 'flex';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Frontend Validations
      if (!name || !email || !password || !confirmPassword) {
        showAlert('Please fill in all registration fields.');
        return;
      }

      if (name.length < 2 || name.length > 50) {
        showAlert('Full Name must be between 2 and 50 characters.');
        nameInput.focus();
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showAlert('Please provide a valid email address.');
        emailInput.focus();
        return;
      }

      if (password.length < 6) {
        showAlert('Password must contain at least 6 characters.');
        passwordInput.focus();
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match. Please verify and re-enter.');
        confirmPasswordInput.focus();
        return;
      }

      // UI state
      submitBtn.disabled = true;
      submitText.style.display = 'none';
      submitSpinner.style.display = 'inline-block';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Registration successful! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html?registered=true';
          }, 1000);
        } else {
          showAlert(data.message || 'Registration failed. Please check your details.');
          submitBtn.disabled = false;
          submitText.style.display = 'inline-flex';
          submitSpinner.style.display = 'none';
        }
      } catch (err) {
        console.error('Registration network error:', err);
        showAlert('Unable to connect to the botanical server. Please try again.');
        submitBtn.disabled = false;
        submitText.style.display = 'inline-flex';
        submitSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
